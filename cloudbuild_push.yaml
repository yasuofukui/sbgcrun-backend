options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - "DEPLOY_ENV=$_DEPLOY_ENV"
    - "SKAFFOLD_DEFAULT_REPO=$_REGION-docker.pkg.dev/$PROJECT_ID/sbgcrun-app"

steps:
  # lintとbuildは並列実行し、deployは両方の成功を待つ
  - name: "golang:1.26"
    id: lint
    waitFor: ["-"]
    entrypoint: "bash"
    args:
      - "-c"
      - |-
        set -eu
        UNFORMATTED=$(gofmt -l .)
        if [ -n "$$UNFORMATTED" ]; then
          echo "gofmt error in:"
          echo "$$UNFORMATTED"
          exit 1
        fi
        go vet ./...
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.63.4
        golangci-lint run

  - name: "gcr.io/cloud-builders/docker"
    id: build
    waitFor: ["-"]
    entrypoint: "bash"
    args:
      - "-c"
      - |-
        set -eu
        TAG=$(echo $COMMIT_SHA | cut -c1-8)
        IMAGE=$${SKAFFOLD_DEFAULT_REPO}/backend
        docker buildx create --driver docker-container --name ci-builder --use
        docker buildx build \
          --cache-from=type=registry,ref=$${IMAGE}:buildcache \
          --cache-to=type=registry,ref=$${IMAGE}:buildcache,mode=max \
          --tag=$${IMAGE}:$${TAG} \
          --push \
          --metadata-file=/workspace/build-metadata.json \
          .
        DIGEST=$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' /workspace/build-metadata.json)
        echo "{\"builds\":[{\"imageName\":\"backend\",\"tag\":\"$${IMAGE}:$${TAG}@$${DIGEST}\"}]}" > artifacts.json

  #  # Chap6ハンズオンのみ使用。Binary Authorizationの証明書を作成するステップ
  #  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
  #    id: create-attestation
  #    waitFor:
  #      - build
  #    entrypoint: "bash"
  #    args:
  #      - "-c"
  #      - |-
  #        apt-get update && apt-get install -y jq
  #        cd app/${_SERVICE_NAME}/
  #        _IMAGE_DIGEST=$(cat artifacts.json | jq -r .builds[0].tag | cut -f 2 -d "@")
  #        echo "IMAGE_DIGEST: $$_IMAGE_DIGEST"
  #        gcloud beta container binauthz attestations sign-and-create \
  #          --project=$PROJECT_ID \
  #          --artifact-url=$${SKAFFOLD_DEFAULT_REPO}/frontend@$${_IMAGE_DIGEST} \
  #          --attestor=cnsrun-attestor \
  #          --attestor-project=$PROJECT_ID \
  #          --keyversion-project=$PROJECT_ID \
  #          --keyversion-location=$_REGION \
  #          --keyversion-keyring=cnsrun-keyring \
  #          --keyversion-key=cnsrun-attestor-key \
  #          --keyversion=1

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: deploy
    waitFor:
      - lint
      - build
    entrypoint: "bash"
    args:
      - "-c"
      - |-
        gcloud deploy releases create $$DEPLOY_ENV-$(git rev-parse --short=8 HEAD)-$(echo $BUILD_ID | cut -c1-8) \
        --project=$PROJECT_ID \
        --region=$_REGION \
        --delivery-pipeline=${_PIPELINE_NAME} \
        --build-artifacts=artifacts.json \
        --skaffold-file=skaffold.yaml
substitutions:
  _PIPELINE_NAME: sbgcrun-backend
  _REGION: asia-northeast1

timeout: 1200s
