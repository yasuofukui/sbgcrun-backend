apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: sbgcrun-backend
serialPipeline:
  stages:
    - targetId: sbgcrun-backend-target
      profiles: [v1]
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: sbgcrun-backend-target
requireApproval: false
run:
  location: projects/PROJECT_ID/locations/REGION
executionConfigs:
- usages:
  - RENDER
  - DEPLOY
  serviceAccount: sbgcrun-clouddeploy@PROJECT_ID.iam.gserviceaccount.com
